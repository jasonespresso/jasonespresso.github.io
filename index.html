<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple, honest recipes with no distractions.">
    <title>SimpleBite — Simple Recipes</title>

<style>
    :root {
        --bg-color: #fdfbf7;
        --text-color: #222222;
        --gray-color: #666666;
        --accent-color: #c86d51;
        --card-bg: #ffffff;
        --border-color: #eae7df;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
        padding: 2rem 1rem;
    }

    header {
        max-width: 1000px;
        margin: 0 auto 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 1.5rem;
    }

    .logo {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text-color);
        text-decoration: none;
    }

    nav {
        display: flex;
        gap: 1.5rem;
    }

    nav a {
        color: var(--gray-color);
        text-decoration: none;
        font-size: 0.95rem;
    }

    nav a:hover,
    nav a:focus-visible {
        color: var(--text-color);
    }

    a:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 3px;
    }

    main {
        max-width: 1000px;
        margin: 0 auto;
    }

    .hero {
        margin-bottom: 3.5rem;
        text-align: left;
    }

    .hero h1 {
        font-size: 2.5rem;
        font-weight: 400;
        letter-spacing: -0.03em;
        margin-bottom: 0.5rem;
    }

    .hero p {
        color: var(--gray-color);
        font-size: 1.1rem;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 2rem;
    }

    .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        overflow: hidden;
        transition: transform 0.2s ease;
    }

    .card:hover {
        transform: translateY(-2px);
    }

    .card-img {
        display: block;
        width: 100%;
        height: 200px;
        object-fit: cover;
        background-color: #f0ede6;
    }

    .card-content {
        padding: 1.25rem;
    }

    .card-category {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent-color);
        margin-bottom: 0.3rem;
        font-weight: 600;
    }

    .card-title {
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .card-title a {
        color: var(--text-color);
        text-decoration: none;
    }

    .card-title a:hover,
    .card-title a:focus-visible {
        text-decoration: underline;
    }

    .card-meta {
        font-size: 0.85rem;
        color: var(--gray-color);
    }

    footer {
        max-width: 1000px;
        margin: 4rem auto 0;
        border-top: 1px solid var(--border-color);
        padding-top: 1.5rem;
        text-align: center;
        font-size: 0.85rem;
        color: var(--gray-color);
    }

    @media (max-width: 600px) {
        body {
            padding: 1.5rem 1rem;
        }

        header {
            margin-bottom: 2.5rem;
        }

        .hero {
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2rem;
        }

        nav {
            gap: 1rem;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .card {
            transition: none;
        }
    }
</style>


</head>

<body>

<header>
    <a href="#" class="logo" aria-label="SimpleBite home">SimpleBite.</a>

    <nav aria-label="Main navigation">
        <a href="#">Recipes</a>
        <a href="#">About</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Simple, honest recipes.</h1>
        <p>No distractions. Just the food.</p>
    </section>

    <section class="grid" aria-label="Featured recipes">

        <!-- Recipe Card 1 -->
        <article class="card">
            <img
                src="./easy-chickpea-masala/chickpea-masala.jpg"
                alt="Easy chickpea masala"
                class="card-img"
            >
            <div class="card-content">
                <div class="card-category">Lunch</div>
                <h2 class="card-title">
                    <a href="./easy-chickpea-masala/index.html">Easy Chickpea Masala</a>
                </h2>
                <div class="card-meta">15 mins</div>
            </div>
        </article>

        <!-- Recipe Card 2 -->
        <article class="card">
            <img
                src="./easy-halloumi-burgers/easy-halloumi-burgers.jpeg"
                alt="Easy halloumi burgers with salad and dressing"
                class="card-img"
            >
            <div class="card-content">
                <div class="card-category">Dinner</div>
                <h2 class="card-title">
                    <a href="./easy-halloumi-burgers/index.html">Easy Halloumi Burgers</a>
                </h2>
                <div class="card-meta">30 mins</div>
            </div>
        </article>

        <!-- Recipe Card 3 -->
        <article class="card">
            <img
                src="./spicy-mexican-bean-soup/spicy-mexican-bean-soup.jpeg"
                alt="Bowl of spicy Mexican bean soup"
                class="card-img"
            >
            <div class="card-content">
                <div class="card-category">Soup</div>
                <h2 class="card-title">
                    <a href="./spicy-mexican-bean-soup/index.html">Spicy Mexican Bean Soup</a>
                </h2>
                <div class="card-meta">25 mins</div>
            </div>
        </article>

    </section>
</main>

<footer>
    <p>&copy; 2026 SimpleBite. Built with minimal HTML &amp; CSS.</p>
</footer>

</body>
</html>
